#  stem.conf  —  configuration for stem, a pure-Krypton terminal
#  ===========================================================================
#  Location:  ~/.config/stem/stem.conf      (or point $STEM_CONF at any file)
#  Format:    key = value      —  '#' starts a comment, blank lines ignored,
#                                 inline '# comments' after a value are stripped.
#  Colours:   hex RRGGBB, with optional 0x or # prefix (e.g. 0x101821, #ccffcc).
#             The framebuffer is opaque, so any alpha is ignored.
#  Reload:    settings are read once at startup — relaunch stem to apply.
#  ===========================================================================


#  ── Shell / session ───────────────────────────────────────────────────────

# Program stem launches in the PTY. May include arguments.
# NB: a Wayland/Hyprland session usually has no $TERM, so stem wraps the shell
# to export it (see `term` below). zsh is macOS-Homebrew-only; Linux has bash.
shell      = /bin/bash          # e.g. /usr/bin/fish, /bin/zsh, "/bin/bash -l"

# $TERM advertised to the shell + programs. xterm-256color is the safe default
# (stem implements its CSI/SGR/OSC subset, 256-colour, alt-screen, etc.).
term       = xterm-256color


#  ── Window / grid ─────────────────────────────────────────────────────────

# Initial terminal size in cells. A tiling compositor (Hyprland) may override
# this on map; for floating windows it sets the opening size.
cols       = 104                # columns  (20..400)
rows       = 30                 # rows     (5..200)


#  ── Scrollback ────────────────────────────────────────────────────────────

# Lines of history kept above the live screen. Scroll with Shift+PageUp/PageDown
# or the mouse wheel. Higher = more memory.
scrollback = 2000


#  ── Colours ───────────────────────────────────────────────────────────────

# Default background / foreground. The base-16 ANSI palette is built in
# (One Dark — readable on dark backgrounds); apps may override the whole palette
# at runtime via OSC 4/10/11/12 (e.g. a shell theme), which stem honours.
bg            = 0x101821         # background  (krypton dark)
fg            = 0xCCFFCC         # foreground  (krypton green)

# Cursor colour. Defaults to `fg` if unset.
cursor_color  = 0xCCFFCC


#  ── Cursor ────────────────────────────────────────────────────────────────

# Shape of the text cursor. Apps can override per-mode via DECSCUSR (e.g. vim
# insert = bar); this is the default when no app requests a shape.
cursor_style  = block           # block | bar | underline


#  ── Bell ──────────────────────────────────────────────────────────────────

# Reaction to the terminal bell (BEL, ^G).
bell          = visual          # visual (brief flash) | off


#  ── Rendering notes (no config needed — listed so you know what works) ─────
#  • 256-colour + 24-bit truecolour (folded to the 256 palette)
#  • bold (-> bright variant), reverse video, underline
#  • DEC line-drawing + box-drawing, block elements, Latin-1, powerline glyphs,
#    and a few Nerd Font icons — via stem's bundled 8x16 atlas (stemfont.k)
#  • alt-screen (vim/less/htop), OSC 0/2 window title, UTF-8 column alignment
#  • clipboard: Ctrl-Shift-V / Shift-Insert paste; drag-select copies; middle
#    click pastes PRIMARY
#  • keys: arrows, Home/End/PgUp/PgDn/Ins/Del, F1-F12, Ctrl-A..Z, Alt/Meta


