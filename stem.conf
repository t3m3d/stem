# STEM terminal configuration
# =============================================================================
# Canonical location: ~/.config/stem/stem.conf
# Override location:  set STEM_CONF to an absolute path
# Syntax:             key = value
# Comments:           # starts a comment; blank lines are ignored
#
# This is a cross-platform superset. A frontend safely ignores settings it
# cannot implement yet. Restart STEM for shell/session changes. The Windows
# preview hot-reloads visual and behavior settings whenever its window regains
# focus.


# Theme and window -----------------------------------------------------------

theme = krypton
title = STEM - Krypton Terminal

# Initial terminal grid. Window managers may override the opening dimensions.
cols = 117
rows = 30

# macOS also understands explicit pixel dimensions.
width = 1120
height = 740
minimum_width = 480
minimum_height = 280

# macOS window chrome. appearance = auto follows the system; dark/light pins it.
appearance = dark              # auto | dark | light
titlebar_transparent = true
center_on_launch = true
start_fullscreen = false
always_on_top = false
window_shadow = true

# Whole-window transparency in the temporary Windows host.
# 1.0 = opaque; 0.2 = most transparent.
opacity = 0.80

# Split panes. Unfocused panes can be dimmed without muting the active pane.
unfocused_pane_opacity = 0.82
split_divider_color = #8B5CF6
focus_follows_mouse = false
pane_gap = 2


# Shell and session ----------------------------------------------------------

# Leave shell unset to use each platform's preferred default:
# Windows: PowerShell 7; macOS: login zsh; Linux: bash.
# shell = pwsh.exe -NoLogo
# shell = /bin/zsh
# shell = /bin/bash

working_directory = ~
term = xterm-256color


# Font and layout ------------------------------------------------------------

# Both names are kept during the shared-schema migration.
font = MesloLGS Nerd Font
font_family = MesloLGS Nerd Font, CaskaydiaCove Nerd Font Mono, JetBrainsMono Nerd Font Mono, Cascadia Mono, Consolas
font_size = 13.5
padding = 10
line_spacing = 0
scrollbar = true


# History and interaction ----------------------------------------------------

# Both names are aliases; frontends use the one they currently understand.
scrollback = 10000
scrollback_lines = 10000
copy_on_select = false
confirm_close = false
bell = visual                 # visual | audible | off


# Cursor ---------------------------------------------------------------------

cursor_style = bar            # bar | block | underline
cursor_blink_ms = 530         # 0 = steady
cursor_color = #8B5CF6


# Krypton colors -------------------------------------------------------------

# Long and short names are aliases during the shared-schema migration.
background = #05070C
bg = #05070C
foreground = #D8DAD4
fg = #D8DAD4

accent = #8B5CF6
selection_background = #3A2A60

# Standard ANSI 16-color palette.
color0 = #1E1E1E
color1 = #F14C4C
color2 = #23D18B
color3 = #F5F543
color4 = #3B8EEA
color5 = #D670D6
color6 = #29B8DB
color7 = #E5E5E5
color8 = #666666
color9 = #F14C4C
color10 = #23D18B
color11 = #F5F543
color12 = #3B8EEA
color13 = #D670D6
color14 = #29B8DB
color15 = #FFFFFF
